<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#bda38e">

  <title>Hijab by Eliza — Natural</title>

  <style>
    :root {
      --accent: #b79a82;
      --dark: #201b18;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video {
      transform: scaleX(-1);
    }

    canvas {
      pointer-events: none;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding:
        env(safe-area-inset-top)
        16px
        env(safe-area-inset-bottom);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
    }

    .brand {
      color: white;
      font-weight: 700;
      letter-spacing: .02em;
      text-shadow: 0 1px 5px #0008;
    }

    .pill {
      pointer-events: auto;

      border: 0;
      background: white;
      color: var(--dark);

      border-radius: 999px;
      padding: 10px 14px;

      font-weight: 600;
      font-size: 16px;
    }

    .bottom {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 12px;
      padding-bottom: 18px;
    }

    #status {
      color: white;
      background: #0008;

      border-radius: 999px;
      padding: 8px 13px;

      font-size: 13px;
    }

    #start {
      pointer-events: auto;

      border: 0;
      border-radius: 999px;

      padding: 15px 26px;

      background: var(--accent);
      color: white;

      font-size: 16px;
      font-weight: 700;

      box-shadow: 0 4px 18px #0005;
    }

    #hint {
      color: white;
      font-size: 12px;
      opacity: .85;

      text-align: center;
      max-width: 300px;

      text-shadow: 0 1px 4px #000;
    }
  </style>
</head>

<body>

<div id="stage">

  <video
    id="video"
    playsinline
    muted
    autoplay
  ></video>

  <canvas id="overlay"></canvas>

</div>


<div id="ui">

  <div class="top">

    <div class="brand">
      Hijab by Eliza · Natural
    </div>

    <button
      id="flip"
      class="pill"
    >
      ↔︎
    </button>

  </div>


  <div class="bottom">

    <div id="status">
      Нажми «Запустить камеру»
    </div>

    <button id="start">
      Запустить камеру
    </button>

    <div id="hint">
      Смотри прямо в камеру. Хиджаб автоматически следует за лицом.
    </div>

  </div>

</div>


<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
}
from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";


/* =========================
   ELEMENTS
========================= */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("overlay");

const ctx =
  canvas.getContext("2d");

const startBtn =
  document.getElementById("start");

const flipBtn =
  document.getElementById("flip");

const statusEl =
  document.getElementById("status");


/* =========================
   HIJAB IMAGE
========================= */

const asset = new Image();

asset.src =
  "./hijab_ar_asset_v1.png";


/* =========================
   VARIABLES
========================= */

let landmarker = null;

let stream = null;

let mirror = true;

let running = false;

let lastVideoTime = -1;


/* =========================
   STATUS
========================= */

function setStatus(text) {

  statusEl.textContent = text;

}


/* =========================
   CANVAS
========================= */

function resizeCanvas() {

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.round(rect.width * dpr);

  canvas.height =
    Math.round(rect.height * dpr);

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}


/* =========================
   MEDIAPIPE
========================= */

async function setupLandmarker() {

  setStatus(
    "Загружаю распознавание лица…"
  );

  const vision =
    await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
    );


  landmarker =
    await FaceLandmarker.createFromOptions(
      vision,
      {

        baseOptions: {

          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

          delegate: "GPU"

        },

        runningMode: "VIDEO",

        numFaces: 1,

        minFaceDetectionConfidence:
          0.55,

        minFacePresenceConfidence:
          0.55,

        minTrackingConfidence:
          0.55

      }
    );

}


/* =========================
   CAMERA
========================= */

async function startCamera() {

  try {

    startBtn.disabled = true;


    if (!landmarker) {

      await setupLandmarker();

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode:
            mirror
              ? "user"
              : "environment",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    resizeCanvas();


    running = true;


    startBtn.style.display =
      "none";


    setStatus(
      "Готово — смотри в камеру"
    );


    requestAnimationFrame(loop);


  } catch (error) {

    console.error(error);

    startBtn.disabled = false;

    setStatus(
      "Не удалось открыть камеру. Проверь разрешение камеры."
    );

  }

}


/* =========================
   VIDEO → SCREEN COORDINATES
========================= */

function videoPointToScreen(
  normalizedX,
  normalizedY
) {

  const videoW =
    video.videoWidth;

  const videoH =
    video.videoHeight;


  const screenW =
    canvas.clientWidth;

  const screenH =
    canvas.clientHeight;


  if (
    !videoW ||
    !videoH ||
    !screenW ||
    !screenH
  ) {

    return {
      x: 0,
      y: 0
    };

  }


  /*
    object-fit: cover

    Определяем масштаб,
    при котором видео полностью
    покрывает экран.
  */

  const scale =
    Math.max(
      screenW / videoW,
      screenH / videoH
    );


  const displayedW =
    videoW * scale;

  const displayedH =
    videoH * scale;


  /*
    Часть видео обрезается
    по краям.
  */

  const offsetX =
    (screenW - displayedW) / 2;

  const offsetY =
    (screenH - displayedH) / 2;


  let x =
    normalizedX *
    videoW *
    scale +
    offsetX;


  const y =
    normalizedY *
    videoH *
    scale +
    offsetY;


  /*
    Фронтальная камера
    зеркальная.
  */

  if (mirror) {

    x =
      screenW - x;

  }


  return {
    x,
    y
  };

}


/* =========================
   DRAW HIJAB
========================= */

function drawHijab(landmarks) {

  const leftEye =
    landmarks[33];

  const rightEye =
    landmarks[263];

  const forehead =
    landmarks[10];

  const chin =
    landmarks[152];


  if (
    !leftEye ||
    !rightEye ||
    !forehead ||
    !chin
  ) {

    return;

  }


  /*
    Переводим landmarks
    в координаты экрана.
  */

  const left =
    videoPointToScreen(
      leftEye.x,
      leftEye.y
    );


  const right =
    videoPointToScreen(
      rightEye.x,
      rightEye.y
    );


  const top =
    videoPointToScreen(
      forehead.x,
      forehead.y
    );


  const bottom =
    videoPointToScreen(
      chin.x,
      chin.y
    );


  /*
    Центр лица
  */

  const centerX =
    (left.x + right.x) / 2;


  /*
    Ширина лица
  */

  const faceWidth =
    Math.abs(
      right.x - left.x
    );


  /*
    Высота лица
  */

  const faceHeight =
    Math.abs(
      bottom.y - top.y
    );


  /*
    Размер хиджаба.

    Немного шире лица,
    чтобы закрывать волосы,
    уши и боковые части головы.
  */

const drawW =
    faceWidth * 5.2;


  const aspect =
    asset.naturalHeight /
    asset.naturalWidth;


  const drawH =
    drawW * aspect;


  /*
    ВАЖНО:

    верх изображения
    начинается выше лба,

    но теперь положение
    рассчитывается относительно
    реального экрана.
  */

  const drawY =
    top.y -
    faceHeight * 0.62;


  const drawX =
    centerX -
    drawW / 2;


  /*
    Наклон головы
  */

  const angle =
    Math.atan2(
      right.y - left.y,
      right.x - left.x
    );


  ctx.save();


  ctx.translate(
    centerX,
    drawY + drawH / 2
  );


  ctx.rotate(angle);


  ctx.globalAlpha =
    0.98;


  ctx.drawImage(
    asset,

    -drawW / 2,
    -drawH / 2,

    drawW,
    drawH
  );


  ctx.restore();

}


/* =========================
   MAIN LOOP
========================= */

function loop() {

  if (!running) {

    return;

  }


  if (
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {

    lastVideoTime =
      video.currentTime;


    const result =
      landmarker.detectForVideo(
        video,
        performance.now()
      );


    ctx.clearRect(
      0,
      0,
      canvas.clientWidth,
      canvas.clientHeight
    );


    if (
      result.faceLandmarks &&
      result.faceLandmarks.length
    ) {

      drawHijab(
        result.faceLandmarks[0]
      );


      setStatus(
        "Hijab ON · Natural"
      );

    } else {

      setStatus(
        "Поднеси лицо к камере"
      );

    }

  }


  requestAnimationFrame(loop);

}


/* =========================
   FLIP CAMERA
========================= */

flipBtn.addEventListener(
  "click",
  async () => {

    mirror =
      !mirror;


    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );


      stream = null;

      running = false;


      startBtn.style.display =
        "";


      startBtn.disabled =
        false;


      video.style.transform =
        mirror
          ? "scaleX(-1)"
          : "scaleX(1)";


      setStatus(
        "Камера переключена"
      );

    }

  }
);


/* =========================
   EVENTS
========================= */

startBtn.addEventListener(
  "click",
  startCamera
);


window.addEventListener(
  "resize",
  resizeCanvas
);


video.addEventListener(
  "loadedmetadata",
  resizeCanvas
);


asset.onload =
  () => {

    setStatus(
      "Нажми «Запустить камеру»"
    );

  };

</script>

</body>
</html>
