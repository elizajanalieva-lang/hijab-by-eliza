<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#bda38e">

<title>Hijab by Eliza — Natural</title>

<style>

:root{
  --accent:#b79a82;
  --dark:#201b18;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#111;
}

video,
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

video{
  transform:scaleX(-1);
}

canvas{
  pointer-events:none;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  padding:
    env(safe-area-inset-top)
    16px
    env(safe-area-inset-bottom);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-top:14px;
}

.brand{
  color:white;
  font-weight:700;
  font-size:18px;
  text-shadow:0 1px 5px #0008;
}

.pill{
  pointer-events:auto;
  border:0;
  background:white;
  color:var(--dark);

  border-radius:999px;
  padding:11px 15px;

  font-size:16px;
  font-weight:600;
}

.bottom{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  padding-bottom:18px;
}

#status{
  color:white;
  background:#0008;

  border-radius:999px;
  padding:8px 13px;

  font-size:13px;
}

#start{
  pointer-events:auto;

  border:0;
  border-radius:999px;

  padding:15px 26px;

  background:var(--accent);
  color:white;

  font-size:16px;
  font-weight:700;

  box-shadow:0 4px 18px #0005;
}

#hint{
  color:white;
  font-size:12px;
  opacity:.85;

  text-align:center;
  max-width:310px;

  text-shadow:0 1px 4px #000;
}

</style>
</head>

<body>

<div id="stage">

  <video
    id="video"
    playsinline
    muted
    autoplay>
  </video>

  <canvas id="overlay"></canvas>

</div>


<div id="ui">

  <div class="top">

    <div class="brand">
      Hijab by Eliza · Natural
    </div>

    <button
      id="flip"
      class="pill">
      ↔
    </button>

  </div>


  <div class="bottom">

    <div id="status">
      Нажми «Запустить камеру»
    </div>

    <button id="start">
      Запустить камеру
    </button>

    <div id="hint">
      Смотри прямо в камеру — хиджаб следует за лицом.
    </div>

  </div>

</div>


<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";


/* =========================================
   ELEMENTS
========================================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("overlay");

const ctx =
canvas.getContext("2d");

const startBtn =
document.getElementById("start");

const flipBtn =
document.getElementById("flip");

const statusEl =
document.getElementById("status");


/* =========================================
   HIJAB IMAGE
========================================= */

const asset =
new Image();

asset.src =
"./hijab_ar_asset_v1.png";


/* =========================================
   STATE
========================================= */

let landmarker = null;

let stream = null;

let mirror = true;

let running = false;

let lastVideoTime = -1;


/* =========================================
   SMOOTHING
========================================= */

let smoothX = null;
let smoothY = null;
let smoothScale = null;
let smoothAngle = null;


/* =========================================
   IMPORTANT:
   COORDINATES OF THE FACE OPENING
   INSIDE OUR PNG
=========================================

PNG size:

1408 × 768

Approximate transparent face opening:

left   = 555
right  = 835

top    = 105
bottom = 455

These values correspond to the
actual Hijab by Eliza PNG.
========================================= */

const OPEN_LEFT   = 555;
const OPEN_RIGHT  = 835;
const OPEN_TOP    = 105;
const OPEN_BOTTOM = 455;

const OPEN_WIDTH =
OPEN_RIGHT - OPEN_LEFT;

const OPEN_HEIGHT =
OPEN_BOTTOM - OPEN_TOP;

const OPEN_CENTER_X =
(OPEN_LEFT + OPEN_RIGHT) / 2;


/* =========================================
   STATUS
========================================= */

function setStatus(text){

  statusEl.textContent =
  text;

}


/* =========================================
   CANVAS
========================================= */

function resizeCanvas(){

  const rect =
  canvas.getBoundingClientRect();

  const dpr =
  window.devicePixelRatio || 1;

  canvas.width =
  Math.round(rect.width * dpr);

  canvas.height =
  Math.round(rect.height * dpr);

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}


/* =========================================
   MEDIAPIPE
========================================= */

async function setupLandmarker(){

  setStatus(
    "Загружаю распознавание лица…"
  );

  const vision =
  await FilesetResolver.forVisionTasks(

    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"

  );


  landmarker =
  await FaceLandmarker.createFromOptions(
    vision,
    {

      baseOptions:{

        modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

        delegate:"GPU"

      },

      runningMode:"VIDEO",

      numFaces:1,

      minFaceDetectionConfidence:
      0.55,

      minFacePresenceConfidence:
      0.55,

      minTrackingConfidence:
      0.55

    }
  );

}


/* =========================================
   CAMERA
========================================= */

async function startCamera(){

  try{

    startBtn.disabled =
    true;


    if(!landmarker){

      await setupLandmarker();

    }


    stream =
    await navigator.mediaDevices
    .getUserMedia({

      video:{

        facingMode:
        mirror
        ? "user"
        : "environment",

        width:{
          ideal:1280
        },

        height:{
          ideal:720
        }

      },

      audio:false

    });


    video.srcObject =
    stream;


    await video.play();


    resizeCanvas();


    running =
    true;


    startBtn.style.display =
    "none";


    setStatus(
      "Готово — смотри в камеру"
    );


    requestAnimationFrame(loop);


  }catch(error){

    console.error(error);

    startBtn.disabled =
    false;

    setStatus(
      "Не удалось открыть камеру"
    );

  }

}


/* =========================================
   VIDEO COORDINATES → SCREEN
========================================= */

function videoPointToScreen(
  x,
  y
){

  const videoW =
  video.videoWidth;

  const videoH =
  video.videoHeight;


  const screenW =
  canvas.clientWidth;

  const screenH =
  canvas.clientHeight;


  if(
    !videoW ||
    !videoH
  ){

    return {
      x:0,
      y:0
    };

  }


  /*
    Safari uses object-fit:cover.
  */

  const scale =
  Math.max(

    screenW / videoW,

    screenH / videoH

  );


  const displayedW =
  videoW * scale;

  const displayedH =
  videoH * scale;


  const offsetX =
  (screenW - displayedW) / 2;

  const offsetY =
  (screenH - displayedH) / 2;


  let screenX =
  x * videoW * scale
  + offsetX;


  const screenY =
  y * videoH * scale
  + offsetY;


  /*
    Front camera is mirrored.
  */

  if(mirror){

    screenX =
    screenW - screenX;

  }


  return{

    x:screenX,

    y:screenY

  };

}


/* =========================================
   SMOOTH NUMBER
========================================= */

function smooth(
  oldValue,
  newValue,
  amount
){

  if(oldValue === null){

    return newValue;

  }

  return (
    oldValue +
    (newValue - oldValue) *
    amount
  );

}


/* =========================================
   ANGLE SMOOTHING
========================================= */

function smoothAngleValue(
  oldValue,
  newValue,
  amount
){

  if(oldValue === null){

    return newValue;

  }


  let difference =
  newValue - oldValue;


  while(
    difference > Math.PI
  ){

    difference -=
    Math.PI * 2;

  }


  while(
    difference < -Math.PI
  ){

    difference +=
    Math.PI * 2;

  }


  return(
    oldValue +
    difference * amount
  );

}


/* =========================================
   DRAW HIJAB
========================================= */

function drawHijab(
  landmarks
){

  /*
    MediaPipe face landmarks:

    33  = left eye
    263 = right eye
    10  = forehead
    152 = chin
  */

  const eye33 =
  landmarks[33];

  const eye263 =
  landmarks[263];

  const forehead =
  landmarks[10];

  const chin =
  landmarks[152];


  if(
    !eye33 ||
    !eye263 ||
    !forehead ||
    !chin
  ){

    return;

  }


  /* ---------------------------------------
     Convert landmarks to screen coordinates
  --------------------------------------- */

  const p33 =
  videoPointToScreen(
    eye33.x,
    eye33.y
  );


  const p263 =
  videoPointToScreen(
    eye263.x,
    eye263.y
  );


  const pForehead =
  videoPointToScreen(
    forehead.x,
    forehead.y
  );


  const pChin =
  videoPointToScreen(
    chin.x,
    chin.y
  );


  /* ---------------------------------------
     IMPORTANT FIX:

     On mirrored front camera,
     anatomical right eye becomes
     screen-left.

     This prevents the 180° rotation.
  --------------------------------------- */

  const screenLeftEye =
  mirror
  ? p263
  : p33;


  const screenRightEye =
  mirror
  ? p33
  : p263;


  /* ---------------------------------------
     Face center
  --------------------------------------- */

  const centerX =
  (
    screenLeftEye.x +
    screenRightEye.x
  ) / 2;


  /* ---------------------------------------
     Face dimensions
  --------------------------------------- */

  const faceWidth =
  Math.abs(
    screenRightEye.x -
    screenLeftEye.x
  );


  const faceHeight =
  Math.abs(
    pChin.y -
    pForehead.y
  );


  if(
    faceWidth < 30 ||
    faceHeight < 40
  ){

    return;

  }


  /* ---------------------------------------
     SCALE FROM THE ACTUAL FACE OPENING
  --------------------------------------- */

  const scaleFromWidth =
  faceWidth /
  OPEN_WIDTH;


  const scaleFromHeight =
  faceHeight /
  OPEN_HEIGHT;


  /*
    Slight extra room so the face
    is completely inside the opening.
  */

  const scale =
  Math.max(
    scaleFromWidth,
    scaleFromHeight
  ) * 1.08;


  const drawW =
  asset.naturalWidth *
  scale;


  const drawH =
  asset.naturalHeight *
  scale;


  /* ---------------------------------------
     POSITION

     Put the PNG's transparent face opening
     directly over the detected face.
  --------------------------------------- */

  const targetX =
  centerX -
  OPEN_CENTER_X * scale;


  const targetY =
  pForehead.y -
  OPEN_TOP * scale;


  /* ---------------------------------------
     CORRECT HEAD ROTATION
  --------------------------------------- */

  const targetAngle =
  Math.atan2(

    screenRightEye.y -
    screenLeftEye.y,

    screenRightEye.x -
    screenLeftEye.x

  );


  /* ---------------------------------------
     SMOOTH MOVEMENT
  --------------------------------------- */

  smoothX =
  smooth(
    smoothX,
    targetX,
    0.35
  );


  smoothY =
  smooth(
    smoothY,
    targetY,
    0.35
  );


  smoothScale =
  smooth(
    smoothScale,
    scale,
    0.30
  );


  smoothAngle =
  smoothAngleValue(
    smoothAngle,
    targetAngle,
    0.30
  );


  const finalW =
  asset.naturalWidth *
  smoothScale;


  const finalH =
  asset.naturalHeight *
  smoothScale;


  /* ---------------------------------------
     DRAW
  --------------------------------------- */

  ctx.save();


  ctx.translate(
    smoothX +
    OPEN_CENTER_X *
    smoothScale,

    smoothY +
    OPEN_TOP *
    smoothScale
  );


  ctx.rotate(
    smoothAngle
  );


  ctx.globalAlpha =
  0.98;


  ctx.drawImage(

    asset,

    -OPEN_CENTER_X *
    smoothScale,

    -OPEN_TOP *
    smoothScale,

    finalW,

    finalH

  );


  ctx.restore();

}


/* =========================================
   MAIN LOOP
========================================= */

function loop(){

  if(!running){

    return;

  }


  if(
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ){

    lastVideoTime =
    video.currentTime;


    const result =
    landmarker.detectForVideo(

      video,

      performance.now()

    );


    ctx.clearRect(

      0,
      0,

      canvas.clientWidth,
      canvas.clientHeight

    );


    if(
      result.faceLandmarks &&
      result.faceLandmarks.length
    ){

      drawHijab(
        result.faceLandmarks[0]
      );


      setStatus(
        "Hijab ON · Natural"
      );

    }else{

      setStatus(
        "Поднеси лицо к камере"
      );

    }

  }


  requestAnimationFrame(
    loop
  );

}


/* =========================================
   FLIP CAMERA
========================================= */

flipBtn.addEventListener(
  "click",
  async ()=>{

    mirror =
    !mirror;


    if(stream){

      stream
      .getTracks()
      .forEach(
        track =>
        track.stop()
      );


      stream =
      null;


      running =
      false;


      smoothX =
      null;

      smoothY =
      null;

      smoothScale =
      null;

      smoothAngle =
      null;


      startBtn.style.display =
      "";


      startBtn.disabled =
      false;


      video.style.transform =
      mirror
      ? "scaleX(-1)"
      : "scaleX(1)";


      setStatus(
        "Камера переключена"
      );

    }

  }
);


/* =========================================
   EVENTS
========================================= */

startBtn.addEventListener(
  "click",
  startCamera
);


window.addEventListener(
  "resize",
  resizeCanvas
);


video.addEventListener(
  "loadedmetadata",
  resizeCanvas
);


asset.onload =
()=>{

  setStatus(
    "Нажми «Запустить камеру»"
  );

};

</script>

</body>
</html>
