<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Hijab by Eliza · Natural V7</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .top {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .brand {
      padding: 9px 13px;
      border-radius: 18px;
      background: rgba(0,0,0,.38);
      color: white;
      font-size: 14px;
      font-weight: 600;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .status {
      padding: 8px 11px;
      border-radius: 18px;
      background: rgba(0,0,0,.38);
      color: #fff;
      font-size: 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .bottom {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 16px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 24px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      background: rgba(255,255,255,.94);
      color: #222;
      box-shadow: 0 5px 20px rgba(0,0,0,.25);
      cursor: pointer;
    }

    button:active {
      transform: scale(.97);
    }

    .hint {
      padding: 8px 13px;
      border-radius: 15px;
      background: rgba(0,0,0,.42);
      color: rgba(255,255,255,.9);
      font-size: 12px;
      text-align: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #start {
      display: block;
    }

    #flip {
      display: none;
    }
  </style>
</head>

<body>

<div id="app">

  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <div class="top">
    <div class="brand">Hijab by Eliza · Natural</div>
    <div class="status" id="status">Готово</div>
  </div>

  <div class="bottom">

    <button id="start">
      Включить камеру
    </button>

    <button id="flip">
      ↔︎ Поменять камеру
    </button>

    <div class="hint">
      Лучше всего работает при хорошем освещении
    </div>

  </div>

</div>

<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";


/* =========================================================
   ELEMENTS
========================================================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startButton = document.getElementById("start");
const flipButton = document.getElementById("flip");
const status = document.getElementById("status");


/* =========================================================
   HIJAB IMAGE
========================================================= */

const asset = new Image();

asset.src = "./hijab_ar_asset_v2.png";

let assetLoaded = false;

asset.onload = () => {
  assetLoaded = true;
};


/* =========================================================
   FACE OPENING
   These values are calibrated for:
   hijab_ar_asset_v2.png
========================================================= */

const OPEN_LEFT = 358;
const OPEN_RIGHT = 722;

const OPEN_TOP = 152;
const OPEN_BOTTOM = 670;

const OPEN_WIDTH = OPEN_RIGHT - OPEN_LEFT;
const OPEN_HEIGHT = OPEN_BOTTOM - OPEN_TOP;

const OPEN_CENTER_X =
  (OPEN_LEFT + OPEN_RIGHT) / 2;

const OPEN_CENTER_Y =
  (OPEN_TOP + OPEN_BOTTOM) / 2;


/* =========================================================
   MEDIAPIPE
========================================================= */

let faceLandmarker = null;

let running = false;
let lastVideoTime = -1;

let mirror = true;


/* =========================================================
   SMOOTHING
========================================================= */

let smoothX = null;
let smoothY = null;

let smoothScaleX = null;
let smoothScaleY = null;

let smoothAngle = null;

let smoothYaw = null;


/* =========================================================
   HELPERS
========================================================= */

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}


function lerp(current, target, amount) {

  if (current === null) {
    return target;
  }

  return current + (target - current) * amount;
}


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

  const rect = canvas.getBoundingClientRect();

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);


/* =========================================================
   VIDEO → SCREEN COORDINATES
========================================================= */

function videoPointToScreen(point) {

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const cw = canvas.clientWidth;
  const ch = canvas.clientHeight;

  if (!vw || !vh || !cw || !ch) {
    return {
      x: 0,
      y: 0
    };
  }

  const scale = Math.max(
    cw / vw,
    ch / vh
  );

  const displayedWidth = vw * scale;
  const displayedHeight = vh * scale;

  const offsetX =
    (cw - displayedWidth) / 2;

  const offsetY =
    (ch - displayedHeight) / 2;

  let x = point.x * displayedWidth + offsetX;
  let y = point.y * displayedHeight + offsetY;

  if (mirror) {
    x = cw - x;
  }

  return {
    x,
    y
  };
}


/* =========================================================
   INITIALIZE MEDIAPIPE
========================================================= */

async function createFaceLandmarker() {

  status.textContent = "Загрузка…";

  const vision =
    await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
    );

  faceLandmarker =
    await FaceLandmarker.createFromOptions(
      vision,
      {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

          delegate: "GPU"
        },

        runningMode: "VIDEO",

        numFaces: 1,

        minFaceDetectionConfidence: 0.5,

        minFacePresenceConfidence: 0.5,

        minTrackingConfidence: 0.5,

        outputFaceBlendshapes: false,

        outputFacialTransformationMatrixes: false
      }
    );

  status.textContent = "Готово";
}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

  try {

    if (!faceLandmarker) {
      await createFaceLandmarker();
    }

    if (video.srcObject) {

      video.srcObject
        .getTracks()
        .forEach(track => track.stop());
    }

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: mirror ? "user" : "environment",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          },

          frameRate: {
            ideal: 30,
            max: 30
          }
        },

        audio: false
      });

    video.srcObject = stream;

    await video.play();

    video.style.transform =
      mirror ? "scaleX(-1)" : "scaleX(1)";

    startButton.style.display = "none";
    flipButton.style.display = "block";

    status.textContent = "Ищем лицо…";

    resizeCanvas();

    resetSmoothing();

    running = true;

    requestAnimationFrame(render);

  } catch (error) {

    console.error(error);

    status.textContent =
      "Не удалось включить камеру";

    startButton.style.display = "block";
  }
}


/* =========================================================
   RESET
========================================================= */

function resetSmoothing() {

  smoothX = null;
  smoothY = null;

  smoothScaleX = null;
  smoothScaleY = null;

  smoothAngle = null;

  smoothYaw = null;
}


/* =========================================================
   DRAW HIJAB
========================================================= */

function drawHijab(landmarks) {

  if (!assetLoaded) {
    return;
  }


  /* -------------------------------------------------------
     IMPORTANT LANDMARKS

     33  = left eye
     263 = right eye

     10  = forehead
     152 = chin

     234 = left cheek
     454 = right cheek

     1   = nose
  ------------------------------------------------------- */

  const p33 =
    videoPointToScreen(landmarks[33]);

  const p263 =
    videoPointToScreen(landmarks[263]);

  const p10 =
    videoPointToScreen(landmarks[10]);

  const p152 =
    videoPointToScreen(landmarks[152]);

  const p234 =
    videoPointToScreen(landmarks[234]);

  const p454 =
    videoPointToScreen(landmarks[454]);

  const p1 =
    videoPointToScreen(landmarks[1]);


  /* =======================================================
     FACE CENTER
  ======================================================= */

  const eyeCenterX =
    (p33.x + p263.x) / 2;

  const faceCenterY =
    (p10.y + p152.y) / 2;


  /* =======================================================
     EYE DISTANCE
  ======================================================= */

  const eyeDistance =
    Math.abs(p263.x - p33.x);


  /* =======================================================
     FACE HEIGHT
  ======================================================= */

  const faceHeight =
    Math.abs(p152.y - p10.y);


  /* =======================================================
     FACE WIDTH
  ======================================================= */

  const cheekDistance =
    Math.abs(p454.x - p234.x);


  /* =======================================================
     YAW ESTIMATION

     We compare nose position with the middle
     of the cheek line.

     This gives us a simple "pseudo 3D"
     head-turn estimation.
  ======================================================= */

  const cheekCenterX =
    (p234.x + p454.x) / 2;

  const halfCheekWidth =
    Math.max(cheekDistance / 2, 1);

  let yawProxy =
    (p1.x - cheekCenterX) / halfCheekWidth;

  yawProxy =
    clamp(yawProxy, -1, 1);


  /*
    Slight amplification so moderate
    head turns are detected earlier.
  */

  let targetYaw =
    clamp(yawProxy * 1.35, -1, 1);


  /* =======================================================
     ROLL ANGLE
  ======================================================= */

  let targetAngle =
    Math.atan2(
      p263.y - p33.y,
      p263.x - p33.x
    );

  targetAngle =
    clamp(
      targetAngle,
      -0.30,
      0.30
    );


  /* =======================================================
     TARGET OPENING SIZE
  ======================================================= */

  let targetOpeningWidth =
    eyeDistance * 1.55;

  let targetOpeningHeight =
    faceHeight * 1.05;


  /* =======================================================
     PSEUDO-3D HEAD TURN

     When head turns:
     - compress horizontal size
     - slightly change opening position
     - slightly skew the hijab
  ======================================================= */

  const turnAmount =
    Math.abs(targetYaw);


  /*
    Don't make it too narrow.
  */

  const turnCompression =
    1 - (0.18 * turnAmount);


  targetOpeningWidth *=
    turnCompression;


  /*
    Slight horizontal movement
    according to head turn.
  */

  const yawShift =
    targetYaw *
    Math.max(faceHeight * 0.055, 3);


  const targetOpeningCenterX =
    eyeCenterX + yawShift;


  /*
    Keep vertical position stable.
  */

  const targetOpeningCenterY =
    faceCenterY + 3;


  /* =======================================================
     SCALE
  ======================================================= */

  let targetScaleX =
    targetOpeningWidth /
    OPEN_WIDTH;

  let targetScaleY =
    targetOpeningHeight /
    OPEN_HEIGHT;


  /*
    Safety limits.
  */

  targetScaleX =
    clamp(
      targetScaleX,
      0.45,
      1.45
    );

  targetScaleY =
    clamp(
      targetScaleY,
      0.45,
      1.45
    );


  /* =======================================================
     TARGET TOP-LEFT
  ======================================================= */

  const targetX =
    targetOpeningCenterX -
    OPEN_CENTER_X * targetScaleX;

  const targetY =
    targetOpeningCenterY -
    OPEN_CENTER_Y * targetScaleY;


  /* =======================================================
     SMOOTHING
  ======================================================= */

  smoothX =
    lerp(
      smoothX,
      targetX,
      0.30
    );

  smoothY =
    lerp(
      smoothY,
      targetY,
      0.30
    );

  smoothScaleX =
    lerp(
      smoothScaleX,
      targetScaleX,
      0.27
    );

  smoothScaleY =
    lerp(
      smoothScaleY,
      targetScaleY,
      0.27
    );

  smoothAngle =
    lerp(
      smoothAngle,
      targetAngle,
      0.22
    );

  smoothYaw =
    lerp(
      smoothYaw,
      targetYaw,
      0.25
    );


  /* =======================================================
     DRAW
  ======================================================= */

  ctx.save();

  /*
    We use the center of the face opening
    as the transformation center.
  */

  const drawCenterX =
    smoothX +
    OPEN_CENTER_X * smoothScaleX;

  const drawCenterY =
    smoothY +
    OPEN_CENTER_Y * smoothScaleY;


  ctx.translate(
    drawCenterX,
    drawCenterY
  );


  /*
    Small roll correction.
  */

  ctx.rotate(
    smoothAngle
  );


  /*
    PSEUDO-3D HORIZONTAL COMPRESSION
  */

  const absYaw =
    Math.abs(smoothYaw);


  const pseudo3DScaleX =
    1 -
    0.12 * absYaw;


  /*
    Horizontal skew.

    This makes the flat PNG behave
    a little more like a surface
    turning with the head.
  */

  const skew =
    smoothYaw * 0.10;


  ctx.transform(
    pseudo3DScaleX,
    0,
    skew,
    1,
    0,
    0
  );


  ctx.drawImage(
    asset,

    -OPEN_CENTER_X * smoothScaleX,
    -OPEN_CENTER_Y * smoothScaleY,

    asset.naturalWidth *
      smoothScaleX,

    asset.naturalHeight *
      smoothScaleY
  );

  ctx.restore();
}


/* =========================================================
   RENDER LOOP
========================================================= */

async function render() {

  if (!running) {
    return;
  }


  if (
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {

    lastVideoTime =
      video.currentTime;


    try {

      const result =
        faceLandmarker.detectForVideo(
          video,
          performance.now()
        );


      ctx.clearRect(
        0,
        0,
        canvas.clientWidth,
        canvas.clientHeight
      );


      if (
        result.faceLandmarks &&
        result.faceLandmarks.length > 0
      ) {

        status.textContent =
          "Хиджаб активен";

        drawHijab(
          result.faceLandmarks[0]
        );

      } else {

        status.textContent =
          "Ищем лицо…";

        resetSmoothing();
      }

    } catch (error) {

      console.error(error);

    }
  }

  requestAnimationFrame(render);
}


/* =========================================================
   BUTTONS
========================================================= */

startButton.addEventListener(
  "click",
  startCamera
);


flipButton.addEventListener(
  "click",
  async () => {

    mirror = !mirror;

    resetSmoothing();

    await startCamera();
  }
);


/* =========================================================
   INITIAL
========================================================= */

resizeCanvas();

</script>

</body>
</html>
