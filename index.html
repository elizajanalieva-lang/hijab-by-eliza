<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Hijab by Eliza · Natural V8 Stable</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #111;
    }

    canvas {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }

    .top {
      position: absolute;

      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;

      z-index: 10;

      display: flex;
      justify-content: space-between;
      align-items: center;

      pointer-events: none;
    }

    .brand,
    .status,
    .hint {
      background: rgba(0, 0, 0, .38);

      color: white;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .brand {
      padding: 9px 13px;

      border-radius: 18px;

      font-size: 14px;
      font-weight: 600;
    }

    .status {
      padding: 8px 11px;

      border-radius: 18px;

      font-size: 12px;
    }

    .bottom {
      position: absolute;

      left: 16px;
      right: 16px;

      bottom:
        calc(
          env(safe-area-inset-bottom, 16px)
          + 16px
        );

      z-index: 20;

      display: flex;
      flex-direction: column;

      align-items: center;

      gap: 10px;
    }

    button {
      border: 0;

      border-radius: 24px;

      padding: 13px 20px;

      font-size: 15px;
      font-weight: 600;

      background: rgba(255, 255, 255, .94);

      color: #222;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, .25);

      cursor: pointer;
    }

    button:active {
      transform: scale(.97);
    }

    .hint {
      padding: 8px 13px;

      border-radius: 15px;

      font-size: 12px;

      text-align: center;
    }

    #start {
      display: block;
    }

    #flip {
      display: none;
    }

  </style>

</head>


<body>

<div id="app">

  <video
    id="video"
    playsinline
    autoplay
    muted
  ></video>

  <canvas id="canvas"></canvas>


  <div class="top">

    <div class="brand">
      Hijab by Eliza · Natural
    </div>

    <div
      class="status"
      id="status"
    >
      Готово
    </div>

  </div>


  <div class="bottom">

    <button id="start">
      Включить камеру
    </button>

    <button id="flip">
      ↔︎ Поменять камеру
    </button>

    <div class="hint">
      Лучше всего работает при хорошем освещении
    </div>

  </div>

</div>


<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const startButton =
  document.getElementById("start");

const flipButton =
  document.getElementById("flip");

const status =
  document.getElementById("status");


/* =========================================================
   HIJAB IMAGE
========================================================= */

const asset = new Image();

asset.src =
  "./hijab_ar_asset_v2.png";

let assetLoaded = false;

asset.onload = () => {
  assetLoaded = true;
};


/* =========================================================
   HIJAB FACE OPENING
   CALIBRATED FOR hijab_ar_asset_v2.png
========================================================= */

const OPEN_LEFT = 358;
const OPEN_RIGHT = 722;

const OPEN_TOP = 152;
const OPEN_BOTTOM = 670;

const OPEN_WIDTH =
  OPEN_RIGHT - OPEN_LEFT;

const OPEN_HEIGHT =
  OPEN_BOTTOM - OPEN_TOP;

const OPEN_CENTER_X =
  (OPEN_LEFT + OPEN_RIGHT) / 2;

const OPEN_CENTER_Y =
  (OPEN_TOP + OPEN_BOTTOM) / 2;


/* =========================================================
   MEDIAPIPE
========================================================= */

let faceLandmarker = null;

let running = false;

let lastVideoTime = -1;

let mirror = true;


/* =========================================================
   STABLE TRACKING STATE
========================================================= */

let smoothX = null;
let smoothY = null;

let smoothScaleX = null;
let smoothScaleY = null;


/*
  Последнее надёжное положение лица.
*/

let lastGoodX = null;
let lastGoodY = null;

let lastGoodScaleX = null;
let lastGoodScaleY = null;


/* =========================================================
   TRACKING SETTINGS
========================================================= */


/*
  Чем меньше число —
  тем плавнее движение.

  Мы специально сделали достаточно
  сильное сглаживание.
*/

const POSITION_SMOOTHING = 0.12;

const SCALE_SMOOTHING = 0.08;


/*
  Маленькие изменения координат
  вообще игнорируем.
*/

const POSITION_DEADZONE = 2.5;


/*
  Максимальное движение маски
  за один кадр.

  Это главный предохранитель
  от скачков.
*/

const MAX_POSITION_STEP = 7;


/*
  Максимальное изменение масштаба
  за один кадр.
*/

const MAX_SCALE_STEP = 0.012;


/*
  Ограничения масштаба.
*/

const MIN_SCALE = 0.45;
const MAX_SCALE = 1.45;


/* =========================================================
   HELPERS
========================================================= */

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(max, value)
  );
}


function lerp(
  current,
  target,
  amount
) {

  if (current === null) {
    return target;
  }

  return (
    current +
    (target - current) * amount
  );
}


/*
  Ограничиваем движение
  за один кадр.
*/

function limitStep(
  current,
  target,
  maxStep
) {

  if (current === null) {
    return target;
  }

  const difference =
    target - current;

  if (
    Math.abs(difference) <=
    maxStep
  ) {

    return target;
  }

  return (
    current +
    Math.sign(difference) *
    maxStep
  );
}


/*
  Deadzone.

  Если изменение совсем маленькое,
  оставляем старое значение.
*/

function applyDeadzone(
  current,
  target,
  deadzone
) {

  if (current === null) {
    return target;
  }

  if (
    Math.abs(target - current) <
    deadzone
  ) {

    return current;
  }

  return target;
}


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.round(
      rect.width * dpr
    );

  canvas.height =
    Math.round(
      rect.height * dpr
    );

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   VIDEO → SCREEN
========================================================= */

function videoPointToScreen(point) {

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;

  const cw =
    canvas.clientWidth;

  const ch =
    canvas.clientHeight;


  if (
    !vw ||
    !vh ||
    !cw ||
    !ch
  ) {

    return {
      x: 0,
      y: 0
    };
  }


  /*
    Same "cover" calculation
    as the video element.
  */

  const scale =
    Math.max(
      cw / vw,
      ch / vh
    );


  const displayedWidth =
    vw * scale;

  const displayedHeight =
    vh * scale;


  const offsetX =
    (cw - displayedWidth) / 2;

  const offsetY =
    (ch - displayedHeight) / 2;


  let x =
    point.x *
    displayedWidth +
    offsetX;

  let y =
    point.y *
    displayedHeight +
    offsetY;


  /*
    Front camera is mirrored.
  */

  if (mirror) {

    x =
      cw - x;
  }


  return {
    x,
    y
  };
}


/* =========================================================
   CREATE FACE LANDMARKER
========================================================= */

async function createFaceLandmarker() {

  status.textContent =
    "Загрузка…";


  const vision =
    await FilesetResolver.forVisionTasks(

      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"

    );


  faceLandmarker =
    await FaceLandmarker.createFromOptions(

      vision,

      {

        baseOptions: {

          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

          delegate:
            "GPU"
        },


        runningMode:
          "VIDEO",


        numFaces:
          1,


        minFaceDetectionConfidence:
          0.5,


        minFacePresenceConfidence:
          0.5,


        minTrackingConfidence:
          0.5,


        outputFaceBlendshapes:
          false,


        outputFacialTransformationMatrixes:
          false

      }

    );


  status.textContent =
    "Готово";
}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

  try {

    if (!faceLandmarker) {

      await createFaceLandmarker();

    }


    if (video.srcObject) {

      video.srcObject
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              mirror
                ? "user"
                : "environment",

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            },

            frameRate: {
              ideal: 30,
              max: 30
            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    await video.play();


    video.style.transform =
      mirror
        ? "scaleX(-1)"
        : "scaleX(1)";


    startButton.style.display =
      "none";

    flipButton.style.display =
      "block";


    status.textContent =
      "Ищем лицо…";


    resizeCanvas();

    resetTracking();


    running = true;

    requestAnimationFrame(
      render
    );


  } catch (error) {

    console.error(error);

    status.textContent =
      "Не удалось включить камеру";

    startButton.style.display =
      "block";

  }

}


/* =========================================================
   RESET TRACKING
========================================================= */

function resetTracking() {

  smoothX = null;
  smoothY = null;

  smoothScaleX = null;
  smoothScaleY = null;

  lastGoodX = null;
  lastGoodY = null;

  lastGoodScaleX = null;
  lastGoodScaleY = null;

}


/* =========================================================
   DRAW HIJAB
========================================================= */

function drawHijab(
  landmarks
) {

  if (!assetLoaded) {
    return;
  }


  /*
    We intentionally use only
    stable basic landmarks.

    33  = eye
    263 = eye
    10  = forehead
    152 = chin
  */


  const p33 =
    videoPointToScreen(
      landmarks[33]
    );


  const p263 =
    videoPointToScreen(
      landmarks[263]
    );


  const p10 =
    videoPointToScreen(
      landmarks[10]
    );


  const p152 =
    videoPointToScreen(
      landmarks[152]
    );


  /* =======================================================
     FACE CENTER
  ======================================================= */


  /*
    Center between the eyes.

    This is much more stable than
    the V7 nose/cheek calculation.
  */

  const eyeCenterX =
    (
      p33.x +
      p263.x
    ) / 2;


  const faceCenterY =
    (
      p10.y +
      p152.y
    ) / 2;


  /* =======================================================
     FACE SIZE
  ======================================================= */

  const eyeDistance =
    Math.abs(
      p263.x -
      p33.x
    );


  const faceHeight =
    Math.abs(
      p152.y -
      p10.y
    );


  /*
    If tracking gives an impossible
    value, don't move the hijab.
  */

  if (
    eyeDistance < 15 ||
    faceHeight < 40
  ) {

    return;
  }


  /* =======================================================
     TARGET OPENING
  ======================================================= */

  let targetOpeningWidth =
    eyeDistance * 1.55;


  let targetOpeningHeight =
    faceHeight * 1.05;


  /* =======================================================
     TARGET SCALE
  ======================================================= */

  let targetScaleX =
    targetOpeningWidth /
    OPEN_WIDTH;


  let targetScaleY =
    targetOpeningHeight /
    OPEN_HEIGHT;


  targetScaleX =
    clamp(
      targetScaleX,
      MIN_SCALE,
      MAX_SCALE
    );


  targetScaleY =
    clamp(
      targetScaleY,
      MIN_SCALE,
      MAX_SCALE
    );


  /* =======================================================
     TARGET POSITION
  ======================================================= */

  /*
    No yaw.
    No cheek calculation.
    No nose calculation.
    No artificial shift.
  */

  const targetOpeningCenterX =
    eyeCenterX;


  const targetOpeningCenterY =
    faceCenterY + 3;


  let targetX =
    targetOpeningCenterX -
    OPEN_CENTER_X *
    targetScaleX;


  let targetY =
    targetOpeningCenterY -
    OPEN_CENTER_Y *
    targetScaleY;


  /* =======================================================
     FIRST FRAME
  ======================================================= */

  if (
    smoothX === null ||
    smoothY === null
  ) {

    smoothX =
      targetX;

    smoothY =
      targetY;

    smoothScaleX =
      targetScaleX;

    smoothScaleY =
      targetScaleY;


    lastGoodX =
      targetX;

    lastGoodY =
      targetY;

    lastGoodScaleX =
      targetScaleX;

    lastGoodScaleY =
      targetScaleY;

  }


  /* =======================================================
     POSITION STABILITY
  ======================================================= */


  targetX =
    applyDeadzone(
      smoothX,
      targetX,
      POSITION_DEADZONE
    );


  targetY =
    applyDeadzone(
      smoothY,
      targetY,
      POSITION_DEADZONE
    );


  /*
    Prevent sudden jumps.
  */

  targetX =
    limitStep(
      smoothX,
      targetX,
      MAX_POSITION_STEP
    );


  targetY =
    limitStep(
      smoothY,
      targetY,
      MAX_POSITION_STEP
    );


  /* =======================================================
     SCALE STABILITY
  ======================================================= */

  targetScaleX =
    limitStep(
      smoothScaleX,
      targetScaleX,
      MAX_SCALE_STEP
    );


  targetScaleY =
    limitStep(
      smoothScaleY,
      targetScaleY,
      MAX_SCALE_STEP
    );


  /* =======================================================
     STRONG SMOOTHING
  ======================================================= */

  smoothX =
    lerp(
      smoothX,
      targetX,
      POSITION_SMOOTHING
    );


  smoothY =
    lerp(
      smoothY,
      targetY,
      POSITION_SMOOTHING
    );


  smoothScaleX =
    lerp(
      smoothScaleX,
      targetScaleX,
      SCALE_SMOOTHING
    );


  smoothScaleY =
    lerp(
      smoothScaleY,
      targetScaleY,
      SCALE_SMOOTHING
    );


  /* =======================================================
     SAVE LAST GOOD POSITION
  ======================================================= */

  lastGoodX =
    smoothX;

  lastGoodY =
    smoothY;

  lastGoodScaleX =
    smoothScaleX;

  lastGoodScaleY =
    smoothScaleY;


  /* =======================================================
     DRAW
  ======================================================= */

  ctx.save();


  /*
    IMPORTANT:

    No rotation.

    No skew.

    No pseudo 3D.

    No transform based on nose.

    This keeps the hijab stable.
  */


  const drawCenterX =
    smoothX +
    OPEN_CENTER_X *
    smoothScaleX;


  const drawCenterY =
    smoothY +
    OPEN_CENTER_Y *
    smoothScaleY;


  ctx.translate(
    drawCenterX,
    drawCenterY
  );


  ctx.drawImage(

    asset,

    -OPEN_CENTER_X *
      smoothScaleX,

    -OPEN_CENTER_Y *
      smoothScaleY,

    asset.naturalWidth *
      smoothScaleX,

    asset.naturalHeight *
      smoothScaleY

  );


  ctx.restore();

}


/* =========================================================
   RENDER LOOP
========================================================= */

async function render() {

  if (!running) {
    return;
  }


  if (
    video.readyState >= 2 &&
    video.currentTime !==
      lastVideoTime
  ) {

    lastVideoTime =
      video.currentTime;


    try {

      const result =
        faceLandmarker.detectForVideo(

          video,

          performance.now()

        );


      /*
        Reset canvas correctly.
      */

      ctx.save();

      ctx.setTransform(
        1,
        0,
        0,
        1,
        0,
        0
      );

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.restore();


      if (
        result.faceLandmarks &&
        result.faceLandmarks.length > 0
      ) {

        status.textContent =
          "Хиджаб активен";


        drawHijab(
          result.faceLandmarks[0]
        );


      } else {

        status.textContent =
          "Ищем лицо…";


        /*
          IMPORTANT:

          Don't reset the position
          just because one frame
          lost the face.

          This prevents the hijab
          from jumping.
        */

      }


    } catch (error) {

      console.error(error);

    }

  }


  requestAnimationFrame(
    render
  );

}


/* =========================================================
   BUTTONS
========================================================= */

startButton.addEventListener(
  "click",
  startCamera
);


flipButton.addEventListener(
  "click",
  async () => {

    mirror =
      !mirror;

    resetTracking();

    await startCamera();

  }
);


/* =========================================================
   INITIAL
========================================================= */

resizeCanvas();

</script>

</body>

</html>
