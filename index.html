<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4eee7">
<title>Natural Hijab by Eliza</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4eee7;color:#342b27;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:560px;margin:auto;padding:16px 14px 28px}
header{text-align:center;padding:5px 0 14px}
h1{font-family:Georgia,serif;font-weight:500;font-size:29px;margin:0 0 5px}
.subtitle{font-size:13px;opacity:.75}
.stage{background:#191715;border-radius:20px;overflow:hidden;aspect-ratio:3/4;max-height:68dvh}
canvas{width:100%;height:100%;display:block}
#camera{display:none}
#status{text-align:center;font-size:13px;line-height:1.5;min-height:38px;padding:10px 4px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:14px;padding:14px 8px;font-size:14px;font-weight:650;background:white;color:#342b27;cursor:pointer}
.primary{background:#b8877b;color:white}
button:disabled{opacity:.45}
.recording{background:#a33b3b;color:white}
.note{text-align:center;font-size:12px;line-height:1.5;opacity:.72;margin-top:14px}
</style>
</head>

<body>
<main>
<header>
<h1>Natural Hijab</h1>
<div class="subtitle">by Eliza · Виртуальный хиджаб</div>
</header>

<div class="stage">
<canvas id="output" width="720" height="960"></canvas>
</div>

<video id="camera" autoplay playsinline muted></video>

<div id="status">Нажмите «Включить камеру» и разрешите доступ.</div>

<div class="controls">
<button class="primary" id="startBtn">Включить камеру</button>
<button id="photoBtn" disabled>📸 Сделать фото</button>
<button id="recordBtn" disabled>🎥 Начать видео</button>
<button id="switchBtn" disabled>🔄 Сменить камеру</button>
<button id="downloadBtn" disabled>⬇️ Сохранить файл</button>
<button id="stopBtn" disabled>⏹ Остановить камеру</button>
</div>

<p class="note">
Фото и видео создаются на устройстве. Во время записи оставьте страницу открытой.
Поддержка видеозаписи зависит от браузера.
</p>
</main>

<script type="module">
import {
 FaceLandmarker,
 FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video=document.getElementById("camera");
const canvas=document.getElementById("output");
const ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status");

const startBtn=document.getElementById("startBtn");
const photoBtn=document.getElementById("photoBtn");
const recordBtn=document.getElementById("recordBtn");
const switchBtn=document.getElementById("switchBtn");
const downloadBtn=document.getElementById("downloadBtn");
const stopBtn=document.getElementById("stopBtn");

const asset=new Image();
asset.src="./hijab_ar_asset_v2.png";

let landmarker=null;
let stream=null;
let facingMode="user";
let running=false;
let rafId=0;
let smooth=null;
let recorder=null;
let chunks=[];
let isRecording=false;
let lastFileUrl=null;
let lastFileName="";

const OPEN_LEFT=358;
const OPEN_RIGHT=722;
const OPEN_TOP=152;
const OPEN_BOTTOM=670;

const OPEN_WIDTH=OPEN_RIGHT-OPEN_LEFT;
const OPEN_HEIGHT=OPEN_BOTTOM-OPEN_TOP;
const CENTER_X=(OPEN_LEFT+OPEN_RIGHT)/2;
const CENTER_Y=(OPEN_TOP+OPEN_BOTTOM)/2;

function setStatus(text){
 statusEl.textContent=text;
}

function clamp(value,min,max){
 return Math.max(min,Math.min(max,value));
}

function limitedStep(current,target,maxStep){
 return current+clamp(target-current,-maxStep,maxStep);
}

async function initModel(){
 if(landmarker)return;

 setStatus("Загружаем распознавание лица…");

 const vision=await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
 );

 landmarker=await FaceLandmarker.createFromOptions(vision,{
  baseOptions:{
   modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
   delegate:"CPU"
  },
  runningMode:"VIDEO",
  numFaces:1
 });
}

async function startCamera(){
 if(running)return;

 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw Error("Откройте сайт в Safari по HTTPS.");
  }

  await initModel();

  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:{ideal:facingMode},
    width:{ideal:720},
    height:{ideal:960}
   }
  });

  video.srcObject=stream;

  await new Promise((resolve,reject)=>{
   video.onloadedmetadata=resolve;
   video.onerror=()=>reject(Error("Не удалось открыть камеру."));
  });

  await video.play();

  running=true;
  smooth=null;

  startBtn.disabled=true;
  photoBtn.disabled=false;
  recordBtn.disabled=false;
  switchBtn.disabled=false;
  stopBtn.disabled=false;

  setStatus("Камера включена. Посмотрите прямо в камеру.");
  renderLoop();

 }catch(error){
  setStatus("Ошибка камеры: "+(error.message||"проверьте разрешение камеры."));
  startBtn.disabled=false;
 }
}

function renderLoop(){
 if(!running)return;

 if(video.readyState>=2 && video.videoWidth){

  // Отражённый предпросмотр, как в передней камере телефона.
  ctx.save();
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.restore();

  try{
   const result=landmarker.detectForVideo(video,performance.now());

   if(result.faceLandmarks?.length){
    const lm=result.faceLandmarks[0];

    const p33=lm[33];
    const p263=lm[263];
    const p10=lm[10];
    const p152=lm[152];

    const eyeCenterX=((1-p33.x)+(1-p263.x))*canvas.width/2;
    const eyeDistance=Math.abs(p263.x-p33.x)*canvas.width;

    const foreheadY=p10.y*canvas.height;
    const chinY=p152.y*canvas.height;
    const faceHeight=Math.abs(chinY-foreheadY);

    const scaleX=clamp((eyeDistance*1.55)/OPEN_WIDTH,.45,1.45);
    const scaleY=clamp((faceHeight*1.05)/OPEN_HEIGHT,.45,1.45);

    const targetCenterY=(foreheadY+chinY)/2+3;
    const targetX=eyeCenterX-CENTER_X*scaleX;
    const targetY=targetCenterY-CENTER_Y*scaleY;

    if(!smooth){
     smooth={x:targetX,y:targetY,sx:scaleX,sy:scaleY};
    }else{
     let dx=targetX-smooth.x;
     let dy=targetY-smooth.y;

     if(Math.abs(dx)<2.5)dx=0;
     if(Math.abs(dy)<2.5)dy=0;

     smooth.x=limitedStep(smooth.x,smooth.x+dx*.12,7);
     smooth.y=limitedStep(smooth.y,smooth.y+dy*.12,7);

     smooth.sx=limitedStep(smooth.sx,smooth.sx+(scaleX-smooth.sx)*.08,.012);
     smooth.sy=limitedStep(smooth.sy,smooth.sy+(scaleY-smooth.sy)*.08,.012);
    }

    if(asset.complete&&asset.naturalWidth){
     ctx.drawImage(
      asset,
      smooth.x,
      smooth.y,
      asset.naturalWidth*smooth.sx,
      asset.naturalHeight*smooth.sy
     );
    }

   }else if(asset.complete&&asset.naturalWidth&&smooth){
    ctx.drawImage(
     asset,
     smooth.x,
     smooth.y,
     asset.naturalWidth*smooth.sx,
     asset.naturalHeight*smooth.sy
    );
   }

  }catch(error){
   console.warn("Face tracking error",error);
  }
 }

 rafId=requestAnimationFrame(renderLoop);
}

function setFile(blob,name){
 if(lastFileUrl)URL.revokeObjectURL(lastFileUrl);

 lastFileUrl=URL.createObjectURL(blob);
 lastFileName=name;

 downloadBtn.disabled=false;

 setStatus("Файл готов! Нажмите «Сохранить файл».");
}

function takePhoto(){
 canvas.toBlob(blob=>{
  if(blob){
   setFile(blob,"natural-hijab-photo.png");
  }else{
   setStatus("Не удалось сделать фото. Попробуйте ещё раз.");
  }
 },"image/png");
}

function getVideoMime(){
 const types=[
  "video/mp4;codecs=h264",
  "video/mp4",
  "video/webm;codecs=vp8",
  "video/webm"
 ];

 return types.find(type=>
  window.MediaRecorder&&MediaRecorder.isTypeSupported(type)
 )||"";
}

function startRecording(){
 if(!canvas.captureStream||!window.MediaRecorder){
  setStatus("Запись видео не поддерживается этим браузером. Попробуйте обновлённый Safari или Chrome.");
  return;
 }

 try{
  const capture=canvas.captureStream(24);
  const mime=getVideoMime();

  recorder=new MediaRecorder(
   capture,
   mime?{mimeType:mime}:undefined
  );

  chunks=[];

  recorder.ondataavailable=event=>{
   if(event.data&&event.data.size){
    chunks.push(event.data);
   }
  };

  recorder.onerror=()=>{
   setStatus("Ошибка записи. Попробуйте ещё раз.");
  };

  recorder.onstop=()=>{
   const type=recorder.mimeType||mime||"video/webm";
   const extension=type.includes("mp4")?"mp4":"webm";

   const blob=new Blob(chunks,{type});

   setFile(blob,"natural-hijab-video."+extension);

   capture.getTracks().forEach(track=>track.stop());

   isRecording=false;
   recordBtn.classList.remove("recording");
   recordBtn.textContent="🎥 Начать видео";

   photoBtn.disabled=false;
   switchBtn.disabled=false;
  };

  recorder.start(250);

  isRecording=true;
  recordBtn.classList.add("recording");
  recordBtn.textContent="⏹ Остановить запись";

  photoBtn.disabled=true;
  switchBtn.disabled=true;

  setStatus("Идёт запись. Нажмите «Остановить запись», когда закончите.");

 }catch(error){
  setStatus("Не удалось начать запись: "+error.message);
 }
}

function stopRecording(){
 if(recorder&&isRecording&&recorder.state!=="inactive"){
  recorder.stop();
 }
}

async function switchCamera(){
 if(isRecording){
  setStatus("Сначала остановите запись.");
  return;
 }

 const wasRunning=running;

 await stopCamera();

 facingMode=facingMode==="user"?"environment":"user";

 if(wasRunning){
  await startCamera();
 }
}

async function stopCamera(){
 running=false;
 cancelAnimationFrame(rafId);

 if(isRecording)stopRecording();

 if(stream){
  stream.getTracks().forEach(track=>track.stop());
  stream=null;
 }

 video.srcObject=null;
 smooth=null;

 startBtn.disabled=false;
 photoBtn.disabled=true;
 recordBtn.disabled=true;
 switchBtn.disabled=true;
 stopBtn.disabled=true;

 setStatus("Камера остановлена. Нажмите «Включить камеру», чтобы начать снова.");
}

startBtn.addEventListener("click",startCamera);
photoBtn.addEventListener("click",takePhoto);

recordBtn.addEventListener("click",()=>{
 if(isRecording)stopRecording();
 else startRecording();
});

switchBtn.addEventListener("click",switchCamera);
stopBtn.addEventListener("click",stopCamera);

downloadBtn.addEventListener("click",()=>{
 if(!lastFileUrl)return;

 const link=document.createElement("a");
 link.href=lastFileUrl;
 link.download=lastFileName;

 document.body.appendChild(link);
 link.click();
 link.remove();

 setStatus("Если файл не сохранился автоматически, откройте его через меню браузера и выберите «Поделиться» → «Сохранить в Файлы».");
});

window.addEventListener("pagehide",()=>{
 if(stream)stream.getTracks().forEach(track=>track.stop());
 if(lastFileUrl)URL.revokeObjectURL(lastFileUrl);
});

ctx.fillStyle="#191715";
ctx.fillRect(0,0,canvas.width,canvas.height);
</script>
</body>
</html>
